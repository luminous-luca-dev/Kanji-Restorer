<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部首→漢字 変換ツール</title>
    <style>
        /* 全体のリセットとベース設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; 
            background-color: #d0ecff; /* 背景を少し落ち着いた色に */
            color: #333;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* メインのカード型コンテナ */
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* うっすらとした影で浮き出させる */
        }

        h2 { font-size: 1.4rem; margin-bottom: 10px; color: #1a1a1a; }
        p.description { font-size: 0.95rem; color: #666; margin-bottom: 20px; line-height: 1.5; }

        /* 入力エリア */
        .input-group { margin-bottom: 20px; }
        textarea { 
            width: 100%; 
            height: 160px; 
            font-size: 16px; 
            padding: 15px; 
            border: 1px solid #dcdfe6; 
            border-radius: 8px; 
            resize: vertical; 
            background-color: #fafbfc;
            transition: all 0.2s ease;
        }
        /* 入力中のフォーカス状態を綺麗に */
        textarea:focus {
            outline: none;
            border-color: #007BFF;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
            background-color: #ffffff;
        }

        /* ボタン類 */
        .action-area { text-align: center; margin-bottom: 30px; }
        button { 
            padding: 12px 28px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-convert {
            background-color: #007BFF; 
            color: white; 
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);
        }
        .btn-convert:hover { background-color: #0056b3; transform: translateY(-1px); }
        .btn-convert:active { transform: translateY(1px); }

        /* 結果エリア */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        h3 { font-size: 1.2rem; color: #1a1a1a; }
        
        .btn-copy {
            background-color: #e2e8f0;
            color: #4a5568;
            padding: 8px 16px;
            font-size: 14px;
        }
        .btn-copy:hover { background-color: #cbd5e0; }

    </style>
</head>
<body>

    <div class="container">
        <h2>エントリーシート文字化け 解消ツール</h2>
        <p class="description">
            「使用できない文字が含まれています」というエラーが出た場合、無意識に特殊な漢字（部首）が混ざっている可能性があります。<br>
            コピーした文章を下の枠に貼り付けて、「変換する」ボタンを押してください。
        </p>

        <div class="input-group">
            <textarea id="inputText" placeholder="ここに文章を貼り付けてください..."></textarea>
        </div>
        
        <div class="action-area">
            <button class="btn-convert" onclick="convertText()">普通の漢字に変換する</button>
        </div>

        <div class="result-header">
            <h3>変換結果</h3>
            <button class="btn-copy" id="copyBtn" onclick="copyResult()">コピーする</button>
        </div>
        <textarea id="outputText" readonly placeholder="変換された文章がここに表示されます..."></textarea>
    </div>

    <script>
        // 部首（康熙部首・CJK部首補助）と、対応する通常の漢字（CJK統合漢字）の辞書
        // エントリーシート等で混入しやすいものを大幅に拡充しています
        const radicalMap = {
            // --- 1〜2画 ---
            '⼀': '一', '⼈': '人', '⼊': '入', '⼋': '八', '⼒': '力', 
            '⼗': '十', '⼚': '厂', '⼛': '厶', '⼜': '又',

            // --- 3画 ---
            '⼝': '口', '⼞': '囗', '⼟': '土', '⼠': '士', '⼡': '夂', 
            '⼢': '夊', '⼣': '夕', '⼤': '大', '⼥': '女', '⼦': '子', 
            '⼧': '宀', '⼨': '寸', '⼩': '小', '⼪': '尢', '⼫': '尸', 
            '⼬': '屮', '⼭': '山', '⼮': '川', '⼯': '工', '⼰': '己', 
            '⼱': '巾', '⼲': '干', '⼳': '幺', '⼴': '广', '⼵': '廴', 
            '⼶': '廾', '⼷': '弋', '⼸': '弓', '⼹': '彐', '⼺': '彡', 

            // --- 4画 ---
            '⼼': '心', '⼽': '戈', '⼾': '戸', '⼿': '手', '⽀': '支', 
            '⽁': '攴', '⽂': '文', '⽃': '斗', '⽄': '斤', '⽅': '方', 
            '⽆': '无', '⽇': '日', '⽉': '月', '⽊': '木', '⽋': '欠', 
            '⽌': '止', '⽍': '歹', '⽎': '殳', '⽏': '毋', '⽐': '比', 
            '⽑': '毛', '⽒': '氏', '⽓': '气', '⽔': '水', '⽕': '火', 
            '⽖': '爪', '⽗': '父', '⽘': '爻', '⽙': '爿', '⽚': '片', 
            '⽛': '牙', '⽜': '牛', '⽝': '犬',

            // --- 5〜6画 ---
            '⽞': '玄', '⽟': '玉', '⽠': '瓜', '⽡': '瓦', '⽢': '甘', 
            '⽣': '生', '⽤': '用', '⽥': '田', '⽦': '疋', '⽧': '疒', 
            '⽨': '癶', '⽩': '白', '⽪': '皮', '⽫': '皿', '⽬': '目', 
            '⽭': '矛', '⽮': '矢', '⽯': '石', '⽰': '示', '⽱': '禸', 
            '⽲': '禾', '⽳': '穴', '⽴': '立', '⽵': '竹', '⽶': '米', 
            '⽷': '糸', '⽸': '缶', '⽹': '网', '⽺': '羊', '⽻': '羽', 
            '⽼': '老', '⽽': '而', '⽾': '耒', '⽿': '耳', '⾀': '聿', 
            '⾁': '肉', '⾂': '臣', '⾃': '自', '⾄': '至', '⾅': '臼', 
            '⾆': '舌', '⾇': '舛', '⾈': '舟', '⾉': '艮', '⾊': '色', 
            '⾋': '艸', '⾌': '虍', '⾍': '虫', '⾎': '血', '⾏': '行', 
            '⾐': '衣', '⾑': '襾',

            // --- 7画以上（特によく使うもの） ---
            '⾒': '見', '⾓': '角', '⾔': '言', '⾕': '谷', '⾖': '豆', 
            '⾗': '豕', '⾘': '豸', '⾙': '貝', '⾚': '赤', '⾛': '走', 
            '⾜': '足', '⾝': '身', '⾞': '車', '⾟': '辛', '⾠': '辰', 
            '⾡': '辵', '⾢': '邑', '⾣': '酉', '⾤': '釆', '⾥': '里', 
            '⾦': '金', '⾧': '長', '⾨': '門', '⾩': '阜', '⾪': '隶', 
            '⾫': '隹', '⾬': '雨', '⾭': '青', '⾮': '非', '⾯': '面', 
            '⾰': '革', '⾱': '韋', '⾲': '韭', '⾳': '音', '⾴': '頁', 
            '⾵': '風', '⾶': '飛', '⾷': '食', '⾸': '首', '⾹': '香', 
            '⾺': '馬', '⾻': '骨', '⾼': '高', '⾽': '髟', '⾾': '鬥', 
            '⾿': '鬯', '⿀': '鬲', '⿁': '鬼', '⿂': '魚', '⿃': '鳥', 
            '⿄': '鹵', '⿅': '鹿', '⿆': '麦', '⿇': '麻', '⿈': '黄', 
            '⿉': '黍', '⿊': '黒', '⿋': '黹', '⿌': '黽', '⿍': '鼎', 
            '⿎': '鼓', '⿏': '鼠', '⿐': '鼻', '⿑': '斉', '⿒': '歯', 
            '⿓': '竜', '⿔': '亀', '⿕': '龠'
        };

        function convertText() {
            let text = document.getElementById('inputText').value;
            if(!text) return; // 空なら何もしない

            // 置換処理
            for (const [radical, kanji] of Object.entries(radicalMap)) {
                text = text.split(radical).join(kanji); 
            }

            document.getElementById('outputText').value = text;
            
            // ボタンの表示をリセット
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.textContent = 'コピーする';
            copyBtn.style.backgroundColor = '#e2e8f0';
            copyBtn.style.color = '#4a5568';
        }

        function copyResult() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) return;

            // クリップボードにコピー
            navigator.clipboard.writeText(outputText.value).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = 'コピーしました！';
                copyBtn.style.backgroundColor = '#48bb78'; // 成功色（緑）
                copyBtn.style.color = 'white';
            }).catch(err => {
                alert('コピーに失敗しました。手動でコピーしてください。');
            });
        }
    </script>
</body>
</html>
